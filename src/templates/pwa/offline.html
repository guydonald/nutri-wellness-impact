{% load static i18n %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5a8f3d">
    <title>Nutri-Wellness Impact</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#f6f9f4; color:#2f5e2f; }
        .box { text-align:center; padding:2rem 1.5rem; max-width:360px; }
        img { width:84px; height:84px; }
        h1 { font-size:1.35rem; margin:1rem 0 .5rem; }
        p { color:#55624f; line-height:1.5; }
        button { margin-top:1rem; background:#5a8f3d; color:#fff; border:0; border-radius:50px;
                 padding:.8rem 1.6rem; font-weight:700; font-size:1rem; }
    </style>
</head>
<body>
    <div class="box">
        <img src="{% static 'pwa/icon-192.png' %}" alt="">
        <h1>{% trans "No internet connection" %}</h1>
        <p>{% trans "Check your mobile data or Wi-Fi, then try again. If you were filling in a form, it has not been sent yet." %}</p>
        <button onclick="location.reload()">{% trans "Try again" %}</button>
    </div>
</body>
</html>
