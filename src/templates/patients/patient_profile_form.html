{% extends "bases.html" %}
{% load crispy_forms_tags i18n %}

{% block content %}
<style>
    :root { --nutri-green: #5a8f3d; --nutri-green-dark: #2f5e2f; --nutri-green-light: #eaf3e3; }
    .form-hero-card {
        background: #fff;
        border-radius: 26px;
        border: 1px solid #eef2ec;
        box-shadow: 0 18px 45px rgba(47, 94, 47, 0.10);
        overflow: hidden;
    }
    .form-hero-head {
        background: linear-gradient(135deg, var(--nutri-green), var(--nutri-green-dark));
        color: #fff;
        padding: 2rem 2.5rem;
    }
    .btn-nutri {
        background: var(--nutri-green); color: #fff; border: none;
        border-radius: 14px; font-weight: 700; transition: all 0.25s ease;
    }
    .btn-nutri:hover { background: var(--nutri-green-dark); color: #fff; transform: translateY(-2px); }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
            <div class="form-hero-card">
                <div class="form-hero-head">
                    <h2 class="fw-bolder mb-1"><i class="bi bi-clipboard2-heart me-2"></i>{% trans "Complete your medical profile" %}</h2>
                    <p class="mb-0 opacity-75">{% trans "This information helps your dietitian provide personalized care." %}</p>
                </div>
                <div class="p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-nutri btn-lg py-3">
                                <i class="bi bi-check-lg me-2"></i>{% trans "Save" %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
