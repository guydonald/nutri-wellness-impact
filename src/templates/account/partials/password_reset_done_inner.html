{% load i18n static %}

<div class="modal-header border-0 pt-4 px-4 pb-0 justify-content-center">
    <div class="text-center">
        <div class="mb-3">
            <i class="bi bi-send-fill" style="color: var(--nutri-green); font-size: 3rem;"></i>
        </div>
        <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Check your emails" %}</h4>
    </div>
    <button type="button" class="btn-close position-absolute end-0 top-0 m-3" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body p-4 text-center">
    <div class="alert alert-success border-0 rounded-4 py-3" style="background-color: #f0fdf4; color: #166534; font-size: 0.9rem;">
        {% blocktrans %}We have sent a reset link to your address.<br><br><strong>Note:</strong> If you don't see it, check your <b>junk mail</b>.{% endblocktrans %}
    </div>

    <button type="button" class="btn btn-auth-full w-100 rounded-pill py-2 mt-3 shadow-sm" data-bs-dismiss="modal">
        {% trans "Got it" %}
    </button>
</div>
