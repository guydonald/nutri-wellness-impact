{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

<div class="modal-header border-0 pt-4 px-4 pb-0">
    <div class="w-100 text-center">
        <img src="{% static 'img/logo.png' %}" alt="Logo" style="height: 60px;" class="mb-3">
        <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Recovery" %}</h4>
        <p class="text-muted small mt-2">{% trans "Enter your email address to receive a code." %}</p>
    </div>
    <button type="button" class="btn-close position-absolute end-0 top-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body p-4">
    <form method="POST"
        action="{% url 'account_reset_password' %}"
        hx-post="{% url 'account_reset_password' %}"
        hx-target="#authModalContent">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-auth-full w-100 rounded-pill py-2" type="submit">{% trans "Send" %}</button>
    </form>

    <div class="text-center mt-4">
        <a href="javascript:void(0);"
           hx-get="{% url 'account_login' %}" hx-target="#authModalContent"
           style="color: var(--nutri-green); font-weight: bold; text-decoration: none;" class="small">
           {% trans "Back to login" %}
        </a>
    </div>
</div>
