{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}

<div class="modal-header border-0 pt-4 px-4 pb-0 justify-content-center">
    <div class="text-center">
        <img src="{% static 'img/logo.png' %}" alt="Nutri-Wellness" style="height: 65px;" class="mb-2">
        <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Join us" %}</h4>
    </div>
    <button type="button" class="btn-close position-absolute end-0 top-0 m-3" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body p-4">
    <form hx-post="{% url 'account_signup' %}" hx-target="#authModalContent" hx-indicator="#signup-loader">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3 text-center">
            <div id="signup-loader" class="htmx-indicator mb-2">
                <div class="spinner-border text-success spinner-border-sm" role="status"></div>
                <small class="text-muted ms-2">{% trans "Preparing your access..." %}</small>
            </div>
            <button class="btn btn-auth-full w-100 rounded-pill py-2" type="submit">
                {% trans "Create my account" %}
            </button>
        </div>
    </form>
    <div class="text-center mt-3">
        <small class="text-muted">{% trans "Already have an account?" %}
            <a href="javascript:void(0);" hx-get="{% url 'account_login' %}" hx-target="#authModalContent"
               style="color: var(--nutri-green); font-weight: bold; text-decoration: none;">{% trans "Log in" %}</a>
        </small>
    </div>
</div>

<style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.btn { opacity: 0.8; cursor: not-allowed; }
</style>
