{% load i18n static %}

<div class="modal-header border-0 pt-4 px-4 pb-0 justify-content-center">
    <div class="text-center">
        <img src="{% static 'img/logo.png' %}" alt="Nutri-Wellness" style="height: 60px;" class="mb-3">
        <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Vérification du compte" %}</h4>
        <p class="text-muted small mt-2">{% trans "Entrez le code envoyé par e-mail." %}</p>
    </div>
</div>

<div class="modal-body p-4 text-center">
    {% if error %}
        <div class="alert alert-danger py-2 small border-0 mb-3" style="border-radius: 10px;">{{ error }}</div>
    {% endif %}

    <form id="otp-form" hx-post="{% url 'account_confirm_email_no_key' %}" hx-target="#authModalContent">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2 mb-4">
            <input type="text" class="otp-field" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-field" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-field" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-field" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-field" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-field" maxlength="1" inputmode="numeric">
        </div>
        
        <input type="hidden" name="code" id="full-code-input">

        <button type="submit" id="btn-verify" class="btn btn-auth-full w-100 rounded-pill py-2">
            {% trans "Vérifier le compte" %}
        </button>
    </form>
</div>

<style>
    /* Tailles réduites pour garantir la visibilité dans la modale */
    .otp-field {
        width: 32px;  /* Réduit pour tenir sur mobile */
        height: 42px; /* Réduit */
        text-align: center;
        font-size: 1.1rem;
        font-weight: bold;
        border: 1.5px solid #e2e8f0;
        border-radius: 6px;
        background-color: #f8fafc;
        transition: all 0.2s;
        padding: 0;
    }

    .otp-field:focus {
        border-color: var(--nutri-green);
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(66, 124, 52, 0.1);
    }

    /* Évite le zoom automatique sur iPhone */
    @media screen and (max-width: 768px) {
        .otp-field {
            font-size: 16px; 
        }
    }
</style>

<script>
(function() {
    const inputs = document.querySelectorAll('.otp-field');
    const hiddenInput = document.getElementById('full-code-input');
    const form = document.getElementById('otp-form');

    function combineCode() {
        let code = "";
        inputs.forEach(input => code += input.value.toUpperCase());
        hiddenInput.value = code;
    }

    inputs.forEach((input, index) => {
        // Gestion de la saisie manuelle
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
            combineCode();
        });

        // Gestion du retour arrière
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) inputs[index - 1].focus();
        });

        // GESTION DU COPIER-COLLER
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const data = e.clipboardData.getData('text').trim().toUpperCase();
            if (data.length === 6) {
                inputs.forEach((inp, i) => inp.value = data[i]);
                combineCode();
                // Déclenche HTMX manuellement pour soumettre
                htmx.trigger(form, 'submit');
            }
        });
    });

    // Synchronisation avant envoi HTMX
    document.body.addEventListener('htmx:configRequest', (event) => {
        if (event.detail.elt.id === 'otp-form') combineCode();
    });
})();
</script>
