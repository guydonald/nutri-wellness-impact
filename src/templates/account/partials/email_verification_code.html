{% load i18n static %}

<div class="modal-header border-0 pt-4 px-4 pb-0 justify-content-center">
    <div class="text-center">
        <img src="{% static 'img/logo.png' %}" alt="Nutri-Wellness" style="height: 60px;" class="mb-3">
        <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Account Verification" %}</h4>
        <p class="text-muted small mt-2">{% trans "Enter the code sent to your email." %}</p>
    </div>
    <button type="button" class="btn-close position-absolute end-0 top-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body p-4 text-center">
    {% if error %}
        <div class="alert alert-danger py-2 small border-0 mb-3" style="border-radius: 10px;">{{ error }}</div>
    {% endif %}

    <form id="otp-form" hx-post="{% url 'account_confirm_email_no_key' %}" hx-target="#authModalContent">
        {% csrf_token %}

        <!-- Champ unique : accepte le format XXXX-XXXX -->
        <div class="mb-4">
            <input type="text" id="otp-code" name="code"
                   class="otp-single"
                   inputmode="text"
                   autocomplete="one-time-code"
                   autocapitalize="characters"
                   spellcheck="false"
                   maxlength="9"
                   placeholder="XXXX-XXXX">
        </div>

        <button type="submit" id="btn-verify" class="btn btn-auth-full w-100 rounded-pill py-2">
            {% trans "Verify account" %}
        </button>
    </form>

    <div class="text-center mt-3">
        <small class="text-muted">{% trans "Didn't receive the code?" %}
            <a href="javascript:void(0);"
               hx-get="{% url 'account_email' %}" hx-target="#authModalContent"
               style="color: var(--nutri-green); font-weight: bold; text-decoration: none;">
               {% trans "Resend" %}
            </a>
        </small>
    </div>
</div>

<style>
    .otp-single {
        width: 100%;
        max-width: 280px;
        height: 60px;
        text-align: center;
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 0.4rem;
        text-transform: uppercase;
        border: 2px solid #e2e8f0;
        border-radius: 14px;
        background-color: #f8fafc;
        transition: all 0.2s;
        color: var(--nutri-green-dark, #2f5e2f);
    }
    .otp-single::placeholder {
        color: #cbd5e1;
        letter-spacing: 0.2rem;
        font-size: 1.3rem;
    }
    .otp-single:focus {
        border-color: var(--nutri-green);
        background-color: #fff;
        outline: none;
        box-shadow: 0 0 0 4px rgba(90, 143, 61, 0.12);
    }
    @media screen and (max-width: 768px) {
        .otp-single { font-size: 1.5rem; height: 54px; letter-spacing: 0.3rem; }
    }
</style>

<script>
(function() {
    const input = document.getElementById('otp-code');
    const form = document.getElementById('otp-form');
    if (!input) return;

    // Formatage automatique : ajoute le tiret apres 4 caracteres, met en majuscules
    function formatCode(value) {
        // Enleve tout sauf lettres et chiffres, met en majuscules
        let clean = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (clean.length > 4) {
            clean = clean.slice(0, 4) + '-' + clean.slice(4, 8);
        }
        return clean;
    }

    input.addEventListener('input', function(e) {
        const formatted = formatCode(e.target.value);
        e.target.value = formatted;
        // Soumission auto quand le code est complet (8 caracteres + 1 tiret = 9)
        if (formatted.length === 9) {
            htmx.trigger(form, 'submit');
        }
    });

    // Collage : formate ce qui est colle
    input.addEventListener('paste', function(e) {
        e.preventDefault();
        const data = (e.clipboardData || window.clipboardData).getData('text');
        const formatted = formatCode(data);
        input.value = formatted;
        if (formatted.length === 9) {
            htmx.trigger(form, 'submit');
        }
    });

    // Focus automatique a l'ouverture
    setTimeout(function() { input.focus(); }, 200);
})();
</script>
