{% load i18n %}
{% load crispy_forms_tags %}

<div class="modal-header border-0 pt-4 px-4 pb-0">
    <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Change password" %}</h4>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body p-4">
    <p class="text-muted small mb-4">
        {% trans "Please enter your current password followed by your new one." %}
    </p>

    <form hx-post="{% url 'account_change_password' %}" hx-target="#authModalContent">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-4">
            <button class="btn btn-auth-full w-100 rounded-pill py-2 shadow-sm" type="submit">
                {% trans "Update password" %}
            </button>
        </div>
    </form>
</div>
