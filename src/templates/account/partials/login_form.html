{% load i18n %}
{% load static %}
{% load crispy_forms_tags %}
<div class="modal-header border-0 pt-4 px-4 pb-0 justify-content-center">
    <div class="text-center">
        <img src="{% static 'img/logo.png' %}" alt="Nutri-Wellness" style="height: 65px;" class="mb-2">
        <h4 class="fw-bold mb-0" style="color: var(--nutri-green);">{% trans "Welcome back !" %}</h4>
    </div>
    <button type="button" class="btn-close position-absolute end-0 top-0 m-3" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body p-4">
    <form method="POST" action="{% url 'account_login' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-3 text-center">
        <div id="signup-loader" class="htmx-indicator mb-2">
            <div class="spinner-border text-success spinner-border-sm" role="status"></div>
            <small class="text-muted ms-2">Préparation de votre accès...</small>
        </div>
        <button class="btn btn-auth-full w-100 rounded-pill py-2 mt-3" type="submit">
            {% trans "Log in" %}
        </button>
    </form>
    <div class="text-center mt-4">
        <p class="small text-muted mb-1">
            {% trans "Pas encore de compte ?" %}
            <a href="javascript:void(0);"
               hx-get="{% url 'account_signup' %}" hx-target="#authModalContent"
               style="color: var(--nutri-red); font-weight: bold; text-decoration: none;">
               {% trans "Register" %}
            </a>
        </p>
        <a href="javascript:void(0);"
           hx-get="{% url 'account_reset_password' %}" hx-target="#authModalContent"
           class="small text-decoration-none text-muted">
           {% trans "Forgotten password ?" %}
        </a>
    </div>
</div>
