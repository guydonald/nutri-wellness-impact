{% load i18n static %}

<div class="modal-body p-5 text-center">
    <div class="mb-4">
        <i class="fas fa-check-circle fa-4x" style="color: #427c34;"></i>
    </div>
    
    <h3 class="fw-bold mb-3" style="color: var(--nutri-green);">{% trans "Password changed!" %}</h3>
    
    <p class="text-muted">
        {% trans 'Your new password has been successfully saved. You can now log in.' %}
    </p>

    <a href="{% url 'index' %}" class="btn btn-auth-full w-100 rounded-pill py-2 mt-4 shadow-sm">
        {% trans "Return to homepage" %}
    </a>
</div>

<script>
    // Force la redirection vers l'accueil si on ferme la modale avec la croix (X)
    document.querySelector('#authModal .btn-close').onclick = function() {
        window.location.href = "{% url 'index' %}";
    };
</script>
