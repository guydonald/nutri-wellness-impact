{% load i18n static %}

<div class="modal-body p-5 text-center">
    <div class="mb-4">
        <i class="bi bi-check-circle-fill" style="color: var(--nutri-green); font-size: 4rem;"></i>
    </div>

    <h3 class="fw-bold mb-3" style="color: var(--nutri-green);">{% trans "Password changed!" %}</h3>

    <p class="text-muted">
        {% trans "Your password has been successfully updated." %}
    </p>

    <a href="{% url 'index' %}" class="btn btn-auth-full w-100 rounded-pill py-2 mt-4 shadow-sm">
        {% trans "Return to homepage" %}
    </a>
</div>

<script>
    var closeBtn = document.querySelector('#authModal .btn-close');
    if (closeBtn) {
        closeBtn.onclick = function() { window.location.href = "{% url 'index' %}"; };
    }
</script>
