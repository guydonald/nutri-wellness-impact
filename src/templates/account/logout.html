{% extends "bases.html" %}
{% load i18n static crispy_forms_tags %}

{% block content %}
<style>
    :root { --nutri-green:#5a8f3d; --nutri-green-dark:#2f5e2f; --nutri-green-light:#eaf3e3; --nutri-red:#d62828; }
    .auth-card { background:#fff; border:0; border-radius:20px; box-shadow:0 18px 45px rgba(47,94,47,.10); }
    .auth-title { color:var(--nutri-green-dark); font-weight:800; }
    .btn-nutri { background:var(--nutri-green); color:#fff; border:none; border-radius:50px;
                 font-weight:700; transition:all .25s ease; }
    .btn-nutri:hover { background:var(--nutri-green-dark); color:#fff; transform:translateY(-2px); }
    .auth-card .form-control { border:1px solid #e4ebe0; border-radius:14px; padding:.7rem 1rem;
                               background:#f8faf6; transition:all .2s ease; }
    .auth-card .form-control:focus { background:#fff; border-color:var(--nutri-green);
                                     box-shadow:0 0 0 .25rem rgba(90,143,61,.15); }
    .auth-card label.form-label { font-weight:600; font-size:.88rem; color:#4a5568; }
    .auth-card .form-text, .auth-card ul { font-size:.78rem; color:#7a8a72; }
    .auth-card ul { padding-left:1.1rem; margin-top:.4rem; }
    .auth-link { color:var(--nutri-green-dark); font-weight:bold; text-decoration:none; }
    .auth-link:hover { text-decoration:underline; }
    @media (max-width:575.98px) { .auth-card { border-radius:16px; } .auth-title { font-size:1.35rem; } }
</style>

<div class="container d-flex align-items-center justify-content-center" style="min-height:70vh;">
    <div class="card auth-card p-4 p-md-5 my-5" style="max-width:500px; width:100%;">
        <div class="text-center">
            <img src="{% static 'img/logo.png' %}" alt="Nutri-Wellness" style="height:62px;" class="mb-3">
            <h2 class="auth-title mb-3" style="color:var(--nutri-red);">{% trans "Logout" %}</h2>
            <p class="text-muted">{% trans "Are you sure you want to log out of Nutri-Wellness?" %}</p>

            <form method="POST" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button class="btn w-100 py-2 mt-3 rounded-pill text-white" type="submit"
                        style="background-color:var(--nutri-red); border:none; font-weight:700;">
                    <i class="bi bi-box-arrow-right me-2"></i>{% trans "Yes, log me out" %}
                </button>
                <a href="{% url 'index' %}" class="btn btn-link w-100 mt-2 text-muted text-decoration-none">
                    {% trans "Cancel" %}
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
