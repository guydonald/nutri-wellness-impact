{% extends "bases.html" %}
{% load i18n static crispy_forms_tags %}

{% block content %}
<style>
    :root { --nutri-green:#5a8f3d; --nutri-green-dark:#2f5e2f; --nutri-green-light:#eaf3e3; --nutri-red:#d62828; }
    .auth-card { background:#fff; border:0; border-radius:20px; box-shadow:0 18px 45px rgba(47,94,47,.10); }
    .auth-icon { width:72px; height:72px; border-radius:50%; display:inline-flex; align-items:center;
                 justify-content:center; font-size:2rem; margin-bottom:1rem; }
    .icon-green { background:var(--nutri-green-light); color:var(--nutri-green-dark); }
    .icon-red { background:#fdecec; color:var(--nutri-red); }
    .btn-nutri { background:var(--nutri-green); color:#fff; border:none; border-radius:50px; font-weight:700;
                 transition:all .25s ease; }
    .btn-nutri:hover { background:var(--nutri-green-dark); color:#fff; transform:translateY(-2px); }
    .btn-nutri-outline { background:transparent; color:var(--nutri-green-dark); border:2px solid var(--nutri-green);
                         border-radius:50px; font-weight:700; transition:all .2s ease; }
    .btn-nutri-outline:hover { background:var(--nutri-green); color:#fff; }
    .auth-title { color:var(--nutri-green-dark); font-weight:800; }
    /* Champs du formulaire */
    .auth-card .form-control { border:1px solid #e4ebe0; border-radius:14px; padding:.7rem 1rem;
                               background:#f8faf6; transition:all .2s ease; }
    .auth-card .form-control:focus { background:#fff; border-color:var(--nutri-green);
                                     box-shadow:0 0 0 .25rem rgba(90,143,61,.15); }
    .auth-card label.form-label { font-weight:600; font-size:.88rem; color:#4a5568; margin-bottom:.35rem; }
    .auth-card .form-text, .auth-card ul { font-size:.78rem; color:#7a8a72; }
    .auth-card ul { padding-left:1.1rem; margin-top:.4rem; }
    @media (max-width:575.98px) { .auth-card { border-radius:16px; } .auth-title { font-size:1.35rem; } }
</style>

<div class="container d-flex align-items-center justify-content-center" style="min-height:70vh;">
    <div class="card auth-card p-4 p-md-5 my-5" style="max-width:520px; width:100%;">
        <div class="text-center">
            <div class="auth-icon icon-green"><i class="bi bi-check-circle-fill"></i></div>
            <h2 class="auth-title mb-3">{% trans "Password changed!" %}</h2>
            <p class="text-muted">{% trans "Your new password has been successfully saved. You can now log in." %}</p>
            <a href="{% url 'account_login' %}" class="btn btn-nutri w-100 py-2 mt-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>{% trans "Log in" %}
            </a>
            <a href="{% url 'index' %}" class="btn btn-nutri-outline w-100 py-2 mt-2">
                {% trans "Return to homepage" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
