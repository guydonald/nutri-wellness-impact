{% extends "bases.html" %}
{% load i18n static crispy_forms_tags %}

{% block content %}
<style>
    :root { --nutri-green:#5a8f3d; --nutri-green-dark:#2f5e2f; --nutri-green-light:#eaf3e3; }
    .auth-card { background:#fff; border:0; border-radius:20px; box-shadow:0 18px 45px rgba(47,94,47,.10); }
    .auth-title { color:var(--nutri-green-dark); font-weight:800; }
    .auth-icon { width:72px; height:72px; border-radius:50%; display:inline-flex; align-items:center;
                 justify-content:center; font-size:2rem; margin-bottom:1rem;
                 background:var(--nutri-green-light); color:var(--nutri-green-dark); }
    .btn-nutri { background:var(--nutri-green); color:#fff; border:none; border-radius:50px;
                 font-weight:700; transition:all .25s ease; }
    .btn-nutri:hover { background:var(--nutri-green-dark); color:#fff; transform:translateY(-2px); }
    .auth-card .form-control { border:1px solid #e4ebe0; border-radius:14px; padding:.7rem 1rem;
                               background:#f8faf6; transition:all .2s ease; }
    .auth-card .form-control:focus { background:#fff; border-color:var(--nutri-green);
                                     box-shadow:0 0 0 .25rem rgba(90,143,61,.15); }
    .auth-card label.form-label { font-weight:600; font-size:.88rem; color:#4a5568; }
    @media (max-width:575.98px) { .auth-card { border-radius:16px; } .auth-title { font-size:1.35rem; } }
</style>

<div class="container d-flex align-items-center justify-content-center" style="min-height:70vh;">
    <div class="card auth-card p-4 p-md-5 my-5" style="max-width:520px; width:100%;">

        <div class="text-center mb-4">
            <div class="auth-icon"><i class="bi bi-key-fill"></i></div>
            <h2 class="auth-title mb-2">{% trans "Recovery" %}</h2>
            <p class="text-muted small mb-0">{% trans "Enter your email address to receive a code." %}</p>
        </div>

        <form method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-nutri w-100 py-2 mt-2">
                <i class="bi bi-send me-2"></i>{% trans "Send" %}
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'account_login' %}" class="small text-decoration-none"
               style="color:var(--nutri-green-dark); font-weight:bold;">
                <i class="bi bi-arrow-left me-1"></i>{% trans "Back to login" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
