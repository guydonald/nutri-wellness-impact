<form hx-post="{% url 'send_patient_email' patient.id %}" hx-target="#email-status">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Envoyer un message à {{ patient.get_full_name }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div id="email-status"></div>
        <div class="mb-3">
            <label class="form-label">Sujet</label>
            <input type="text" name="subject" class="form-control" placeholder="ex: Suivi de votre plan alimentaire" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="5" required></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Envoyer
        </button>
    </div>
</form>
