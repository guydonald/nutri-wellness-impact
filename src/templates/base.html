<!DOCTYPE html>
{% load static %}
{% load i18n %}
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title> Nutri-Wellness Impact</title>
        <!-- Favicon-->
        <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">
        <!-- Custom Google font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
        <!-- Bootstrap icons-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
        <script src="{% static 'js/htmx.min.js' %}"></script>
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column h-100">
        <main class="flex-shrink-0">
            {% block navbar %}{% endblock %}
            {% block content %}{% endblock %}
        </main>
            {% block footer %}{% endblock %}
        <!-- Bootstrap core JS-->
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'js/popper.min.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        
        <div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: 20px; overflow: hidden;">
                    <div id="authModalContent">
                        <div class="p-5 text-center">
                            <div class="spinner-border" style="color: var(--nutri-green);" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const urlParams = new URLSearchParams(window.location.search);
                
                if (urlParams.get('action') === 'reset_password_confirm') {
                    const uid = urlParams.get('uid');
                    const key = urlParams.get('key');
                    
                    if (uid && key) {
                        const modalElement = document.getElementById('authModal');
                        const authModal = new bootstrap.Modal(modalElement);
                        
                        // On construit l'URL Allauth standard. 
                        // IMPORTANT: Vérifiez que votre URL allauth finit bien par un slash /
                        const fetchUrl = `/accounts/password/reset/key/${uid}-${key}/`;
                        
                        // On affiche la modale d'abord
                        authModal.show();

                        // On charge le contenu via HTMX avec un léger délai pour éviter les conflits
                        setTimeout(() => {
                            htmx.ajax('GET', fetchUrl, {target:'#authModalContent'});
                        }, 100);

                        // Optionnel: Nettoyer l'URL du navigateur sans recharger la page
                        const newUrl = window.location.pathname;
                        window.history.replaceState({}, document.title, newUrl);
                    }
                }
            });
        </script>        
        <!-- Core theme JS-->
        <!--<script src="{% static 'js/scripts.js' %}"></script>-->
    </body>
</html>
